[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openrazer_daemon"
version = "3.12.1"
dependencies = [
    "daemonize >= 2.4.7",
    "dbus-python >= 1.2.0",
    "PyGObject >= 3.20.0",
    "pyudev >= 0.16.1",
    "setproctitle >= 1.1.8",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
exclude = ["tests"]
