image: ubuntu/oldlts
packages:
  - linux-headers-generic
  - python3-build
  - python3-installer
  - python3-setuptools
sources:
  - https://github.com/openrazer/openrazer
tasks:
  - compile-driver: |
      cd openrazer

      # Compile the kernel driver
      echo "ccflags-y += -Wall -Werror" >> driver/Makefile
      kerneldir=(/lib/modules/*/build)
      make KERNELDIR="${kerneldir[0]}"

  - install: |
      cd openrazer
      make DESTDIR=/tmp/openrazer ubuntu_daemon_install ubuntu_python_library_install
